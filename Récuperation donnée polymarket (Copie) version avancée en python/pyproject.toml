[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-btc-5m-collector"
version = "0.1.0"
description = "Robust BTC Up/Down 5m Polymarket data collector with install wizard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.7",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "loguru>=0.7.2",
  "httpx>=0.27.0",
  "websockets>=13.0.1",
  "python-dotenv>=1.0.1",
]

[project.scripts]
collector = "collector.cli:app"

[tool.setuptools]
packages = ["collector"]
